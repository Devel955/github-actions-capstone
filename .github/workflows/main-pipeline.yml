name: Main Branch Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-test:
    name: Build and Test
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      python_version: "3.11"
      run_tests: true

  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: build-test
    outputs:
      image_url: ${{ steps.set-image-url.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get short SHA
        id: short-sha
        run: echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKER_USERNAME }}/github-actions-capstone:latest
            ${{ vars.DOCKER_USERNAME }}/github-actions-capstone:sha-${{ steps.short-sha.outputs.sha }}

      - name: Set image URL output
        id: set-image-url
        run: echo "url=${{ vars.DOCKER_USERNAME }}/github-actions-capstone:sha-${{ steps.short-sha.outputs.sha }}" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker
    environment: production

    steps:
      - name: Deploy
        run: |
          echo "Deploying image: ${{ needs.docker.outputs.image_url }}"
          echo "Triggered by: ${{ github.actor }}"

      - name: Write summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Image: ${{ needs.docker.outputs.image_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- Actor: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- Time: $(date -u)" >> $GITHUB_STEP_SUMMARY