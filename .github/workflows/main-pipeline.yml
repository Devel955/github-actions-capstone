name: Main Branch Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    name: Build and Test
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      python_version: "3.11"
      run_tests: true

  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: build-test
    outputs:
      image_url: ${{ steps.set-image-url.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get short SHA
        id: short-sha
        run: echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and push image
        env:
          DOCKER_BUILDKIT: 0
        run: |
          docker build -t ${{ vars.DOCKER_USERNAME }}/github-actions-capstone:latest .
          docker tag ${{ vars.DOCKER_USERNAME }}/github-actions-capstone:latest ${{ vars.DOCKER_USERNAME }}/github-actions-capstone:sha-${{ steps.short-sha.outputs.sha }}
          docker push ${{ vars.DOCKER_USERNAME }}/github-actions-capstone:latest
          docker push ${{ vars.DOCKER_USERNAME }}/github-actions-capstone:sha-${{ steps.short-sha.outputs.sha }}

      - name: Scan Docker Image for Vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'anan623/github-actions-capstone:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Set image URL output
        id: set-image-url
        run: echo "url=${{ vars.DOCKER_USERNAME }}/github-actions-capstone:sha-${{ steps.short-sha.outputs.sha }}" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker
    environment: production

    steps:
      - name: Deploy
        run: |
          echo "Deploying image: ${{ needs.docker.outputs.image_url }}"
          echo "Triggered by: ${{ github.actor }}"

      - name: Write summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Image: ${{ needs.docker.outputs.image_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- Actor: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- Time: $(date -u)" >> $GITHUB_STEP_SUMMARY